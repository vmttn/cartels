<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de cartels</title>
  <style>
    /* ── Global ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #f0ede8;
      color: #222;
      min-height: 100vh;
    }

    /* ── Screen layout ── */
    @media screen {
      .page {
        display: flex;
        gap: 1.5rem;
        padding: 2rem;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
      }

      .panel {
        background: #fff;
        border: 1px solid #d0ccc6;
        border-radius: 4px;
        padding: 1.5rem;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
      }

      .panel h1 {
        font-size: 1rem;
        font-weight: bold;
        letter-spacing: .06em;
        text-transform: uppercase;
        margin-bottom: 1.25rem;
        color: #3a3a3a;
        border-bottom: 2px solid #3a3a3a;
        padding-bottom: .5rem;
      }

      .cartels-panel {
        margin-bottom: 1rem;
      }

      .cartels-panel .field-group {
        margin-bottom: 1.1rem;
      }

      .cartel-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: .4rem;
      }

      .cartel-actions .btn-add {
        grid-column: 1 / -1;
        background: #3a3a3a;
        color: #fff;
      }

      /* Form column: cartels card, form card, then print button. Sticks to the window and
         centers its content vertically; scrolls if the window is too short. */
      .form-column {
        flex: 0 0 320px;
        align-self: flex-start;
        position: sticky;
        top: 2rem;
        height: calc(100vh - 4rem);
        display: flex;
        flex-direction: column;
        justify-content: safe center;
        overflow-y: auto;
      }

      .print-info {
        margin-top: .6rem;
        font-family: Arial, sans-serif;
        font-size: .72rem;
        color: #888;
        line-height: 1.4;
        text-align: center;
      }

      .field-group {
        margin-bottom: .9rem;
      }

      .field-group label {
        display: block;
        font-size: .72rem;
        text-transform: uppercase;
        letter-spacing: .05em;
        color: #666;
        margin-bottom: .25rem;
        font-family: Arial, sans-serif;
      }

      .field-group input,
      .field-group textarea,
      .field-group select {
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 2px;
        padding: .35rem .5rem;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: .9rem;
        color: #222;
        background: #fafaf8;
        transition: border-color .15s;
      }

      .field-group input:focus,
      .field-group textarea:focus,
      .field-group select:focus {
        outline: none;
        border-color: #3a3a3a;
        background: #fff;
      }

      .field-group textarea {
        resize: vertical;
        min-height: 120px;
        line-height: 1.45;
      }

      .field-row {
        display: flex;
        gap: .6rem;
      }

      .field-row .field-group {
        flex: 1;
      }

      /* Buttons */
      .btn {
        display: block;
        width: 100%;
        padding: .45rem .6rem;
        background: #fff;
        color: #3a3a3a;
        border: 1px solid #3a3a3a;
        border-radius: 2px;
        font-family: Arial, sans-serif;
        font-size: .72rem;
        text-transform: uppercase;
        letter-spacing: .06em;
        cursor: pointer;
        transition: background .15s, color .15s;
      }

      @media (hover: hover) {
        .btn:hover:not(:disabled) { background: #f4f2ee; }
        .btn-print:hover:not(:disabled) { background: #555; }
        .cartel-actions .btn-add:hover { background: #555; }
      }
      .btn:disabled { opacity: .4; cursor: default; }
      .btn[hidden] { display: none; }

      .btn.danger.confirming {
        background: #9b2c20;
        border-color: #9b2c20;
        color: #fff;
      }

      .btn-print {
        margin-top: 1rem;
        padding: .6rem 1rem;
        background: #3a3a3a;
        color: #fff;
        font-size: .8rem;
        letter-spacing: .08em;
      }

      .btn-copy {
        margin-top: .5rem;
      }

      #link-info:empty { display: none; }
      #link-info { color: #8a6a12; }

      /* Preview panel */
      /* As wide as an A4 sheet at real size, narrower if the window is */
      .preview-panel {
        flex: 0 1 210mm;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .preview-toolbar {
        align-self: stretch;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: .4rem;
      }

      .preview-toolbar .panel-title {
        font-family: Arial, sans-serif;
        font-size: .72rem;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: #888;
        margin-right: auto;
      }

      /* A4 sheets, scaled down with a transform so layout (and text fitting)
         happens at true print size. The viewport gets the scaled dimensions. */
      /* Padding gives the sheet shadows room inside the clipping box; negative
         margins keep it out of the layout, and it lets clicks through to the
         toolbar it overlaps. */
      .sheets-viewport {
        --shadow-room: 32px;
        overflow: hidden;
        padding: var(--shadow-room);
        margin: calc(-1 * var(--shadow-room));
        pointer-events: none;
      }

      .sheets-viewport .print-area {
        pointer-events: auto;
      }

      .print-area {
        width: 210mm;
        transform-origin: top left;
      }

      .print-area .sheet {
        background: #fff;
        box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.14);
        margin-bottom: 10mm;
      }

      .print-area .label {
        position: relative;
        cursor: pointer;
      }

      @media (hover: hover) {
        .print-area .label:hover:not(.selected) {
          outline: .5mm solid #b8b0a4;
          outline-offset: -.25mm;
        }
      }

      /* Fit warnings, set by fit() via data-fit */
      .print-area .label[data-fit]::after {
        position: absolute;
        top: 2mm;
        right: 2mm;
        padding: .4mm 1.5mm;
        border-radius: .6mm;
        font-family: Arial, sans-serif;
        font-size: 7pt;
        text-transform: uppercase;
        letter-spacing: .04em;
      }

      .print-area .label[data-fit="shrunk"]::after {
        content: 'Réduit';
        background: #f3e6c4;
        color: #6b5310;
      }

      .print-area .label[data-fit="overflow"]::after {
        content: 'Déborde';
        background: #f2cfcb;
        color: #7a1f16;
      }

      .print-area .label.selected {
        z-index: 1;
        outline: .8mm solid #3a3a3a;
        outline-offset: -.4mm;
      }

      /* The default selection outline disappears on the dark Orsay card */
      .print-area .label.style-orsay.selected {
        outline-color: #f4f4f2;
      }

      /* Print dialog: pick the cartels to print */
      .print-dialog {
        margin: auto;
        width: min(26rem, calc(100vw - 2rem));
        color: inherit;
      }

      .print-dialog::backdrop {
        background: rgba(0,0,0,.35);
      }

      .print-list {
        list-style: none;
        max-height: 50vh;
        overflow-y: auto;
        margin-bottom: .8rem;
        border-block: 1px solid #e4e0da;
      }

      .print-list li + li {
        border-top: 1px solid #e4e0da;
      }

      .print-list label {
        display: flex;
        align-items: center;
        gap: .6rem;
        padding: .45rem .2rem;
        font-size: .9rem;
        cursor: pointer;
      }

      .print-list input {
        flex: none;
        width: 1rem;
        height: 1rem;
        accent-color: #3a3a3a;
      }

      .print-dialog .print-info {
        margin: .6rem 0 0;
      }

      .print-dialog-actions {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: .4rem;
        margin-top: 1rem;
      }

      .print-dialog-actions .btn-print {
        margin-top: 0;
      }
    }

    /* ── Narrow screens: form on top, preview below ── */
    @media screen and (max-width: 760px) {
      .page {
        flex-direction: column;
        align-items: stretch;
        padding: 1rem;
        gap: 1.5rem;
      }

      .form-column {
        flex: none;
        align-self: center;
        width: 100%;
        max-width: 30rem;
        position: static;
        height: auto;
        overflow: visible;
      }

      .preview-panel {
        flex: none;
      }

      /* 16px keeps iOS from zooming in on focus */
      .field-group input,
      .field-group textarea,
      .field-group select {
        font-size: 16px;
      }

      .btn {
        min-height: 44px;
      }

      .btn-print {
        min-height: 48px;
      }

      .print-list label {
        min-height: 44px;
      }

      /* Must not exceed the page padding, or the page scrolls sideways */
      .sheets-viewport {
        --shadow-room: 1rem;
      }
    }

    /* ── Label card — shared structural styles ──
       Physical size 10 × 7 cm. Font sizes scale with --k (auto-shrink). */
    .label {
      --k: 1;
      width: 100mm;
      height: 70mm;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .label-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Louvre style ── */
    .label.style-louvre {
      background: #fdfcf8;
      border: 1px solid #b8b0a4;
    }

    .label.style-louvre .label-content {
      padding: 5mm 6mm 4.5mm;
    }

    .label.style-louvre .artist {
      font-size: calc(var(--k) * 14pt);
      line-height: 1.15;
      margin-bottom: .2em;
    }

    .label.style-louvre .artist .firstname {
      font-weight: normal;
    }

    .label.style-louvre .artist .lastname {
      font-variant: small-caps;
      font-weight: bold;
    }

    .label.style-louvre .dates {
      font-size: calc(var(--k) * 8pt);
      color: #444;
      margin-bottom: 1.1em;
      font-style: normal;
    }

    .label.style-louvre .artwork-title {
      font-weight: bold;
      font-size: calc(var(--k) * 10pt);
      margin-bottom: .2em;
    }

    .label.style-louvre .medium {
      font-size: calc(var(--k) * 8pt);
      color: #444;
      margin-bottom: .9em;
    }

    .label.style-louvre .description {
      font-size: calc(var(--k) * 8.5pt);
      line-height: 1.45;
      text-align: justify;
      color: #222;
      flex: 1;
    }

    /* ── MoMA style ── */
    .label.style-moma {
      background: #fff;
      border: 1px solid #ccc;
      font-family: 'Franklin Gothic Book', 'Libre Franklin', 'Helvetica Neue', Arial, sans-serif;
      color: #111;
    }

    .label.style-moma .label-content {
      padding: 6mm 7mm 5mm;
    }

    .label.style-moma .artist {
      font-size: calc(var(--k) * 17pt);
      line-height: 1.1;
      margin-bottom: .1em;
    }

    .label.style-moma .dates {
      font-size: calc(var(--k) * 8.5pt);
      margin-bottom: .9em;
    }

    .label.style-moma .artwork-title {
      font-size: calc(var(--k) * 8.5pt);
      margin-bottom: .15em;
    }

    .label.style-moma .artwork-title strong {
      font-weight: bold;
    }

    .label.style-moma .year {
      margin-left: .4em;
    }

    .label.style-moma .medium {
      font-size: calc(var(--k) * 8.5pt);
      margin-bottom: 1.8em;
    }

    .label.style-moma .description {
      font-size: calc(var(--k) * 8.5pt);
      line-height: 1.4;
      flex: 1;
    }

    /* ── Orsay style ── */
    .label.style-orsay {
      background: #3b3b3d;
      border: 1px solid #3b3b3d;
      color: #f4f4f2;
      font-family: 'Univers Condensed', 'Frutiger LT Condensed', 'Roboto Condensed', 'Liberation Sans Narrow', 'Arial Narrow', Arial, sans-serif;
      font-stretch: condensed;
    }

    .label.style-orsay .label-content {
      padding: 7mm 6mm 5mm 12mm;
    }

    .label.style-orsay .artist {
      font-size: calc(var(--k) * 15pt);
      line-height: 1.1;
      margin-bottom: .2em;
    }

    .label.style-orsay .dates {
      font-size: calc(var(--k) * 8.5pt);
      margin-bottom: calc(var(--k) * 3.5mm);
    }

    /* Rule above the work, from the left margin to the right edge, with a short
       vertical tick hanging down beside the title. */
    .label.style-orsay .work {
      position: relative;
      margin: 0 -3mm 0 -8mm;
      padding: calc(var(--k) * 3mm) 3mm 0 8mm;
      border-top: .3mm solid currentColor;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .label.style-orsay .work::before {
      content: '';
      position: absolute;
      top: 0;
      left: 3.5mm;
      width: .3mm;
      height: calc(var(--k) * 7mm);
      background: currentColor;
    }

    .label.style-orsay .artwork-title {
      font-size: calc(var(--k) * 14pt);
      font-weight: bold;
      line-height: 1.1;
      margin-bottom: .35em;
    }

    .label.style-orsay .year,
    .label.style-orsay .medium {
      font-size: calc(var(--k) * 9pt);
      font-weight: 600;
      margin-bottom: .35em;
    }

    .label.style-orsay .description {
      font-size: calc(var(--k) * 8pt);
      line-height: 1.4;
      margin-top: .6em;
    }

    /* ── Print sheets: A4, 2 × 3 cartels, shared dashed cut lines ── */
    .sheet {
      width: 210mm;
      height: 297mm;
      display: grid;
      grid-template-columns: repeat(2, 100mm);
      grid-template-rows: repeat(3, 70mm);
      justify-content: center;
      align-content: center;
    }

    .sheet .label {
      border: none;
      outline: .2mm dashed #999;
    }

    /* ── Print ── */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      .form-column,
      .preview-toolbar,
      .print-dialog {
        display: none !important;
      }

      body { background: white; }

      .page,
      .preview-panel {
        display: block;
      }

      .sheets-viewport {
        width: auto !important;
        height: auto !important;
        padding: 0;
        margin: 0;
      }

      .print-area {
        transform: none !important;
      }

      .sheet {
        break-after: page;
      }

      .sheet:last-child {
        break-after: auto;
      }

      .label {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- ── Form column ── -->
    <aside class="form-column">
    <div class="panel cartels-panel">
      <h1>Mes cartels</h1>

      <div class="field-group">
        <label for="inp-style">Style (tous les cartels)</label>
        <select id="inp-style" onchange="switchStyle()">
          <option value="louvre">Louvre</option>
          <option value="moma">MoMA</option>
          <option value="orsay">Orsay</option>
        </select>
      </div>

      <div class="cartel-actions">
        <button class="btn btn-add" onclick="addCartel()">+ Ajouter</button>
        <button class="btn" onclick="duplicateCartel()">Dupliquer</button>
        <button class="btn danger" id="btn-delete" onclick="deleteCartel()">Supprimer</button>      </div>
    </div>

    <div class="panel form-panel">

      <div class="field-row">
        <div class="field-group">
          <label for="inp-firstname">Prénom</label>
          <input id="inp-firstname" type="text" data-field="firstname">
        </div>
        <div class="field-group">
          <label for="inp-lastname">Nom</label>
          <input id="inp-lastname" type="text" data-field="lastname">
        </div>
      </div>

      <div class="field-group">
        <label for="inp-nationality">Nationalité</label>
        <input id="inp-nationality" type="text" data-field="nationality">
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="inp-birth">Naissance</label>
          <input id="inp-birth" type="text" data-field="birth">
        </div>
        <div class="field-group">
          <label for="inp-death">Décès</label>
          <input id="inp-death" type="text" data-field="death">
        </div>
      </div>

      <div class="field-group">
        <label for="inp-title">Titre de l'œuvre</label>
        <input id="inp-title" type="text" data-field="title">
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="inp-medium">Techniques</label>
          <input id="inp-medium" type="text" data-field="medium">
        </div>
        <div class="field-group">
          <label for="inp-year">Année</label>
          <input id="inp-year" type="text" data-field="year">
        </div>
      </div>

      <div class="field-group">
        <label for="inp-description">Description</label>
        <textarea id="inp-description" data-field="description"></textarea>
      </div>
    </div>

      <button class="btn btn-print" id="btn-print" onclick="openPrintDialog()">Imprimer les cartels…</button>
      <button class="btn btn-copy" id="btn-copy" onclick="copyLink()">Copier le lien</button>
      <p class="print-info" id="print-info"></p>
      <p class="print-info" id="link-info"></p>
    </aside>

    <!-- ── Preview panel: the A4 sheets, click a cartel to edit it ── -->
    <main class="preview-panel">
      <div class="preview-toolbar">
        <p class="panel-title" id="preview-title">Aperçu</p>
      </div>
      <div class="sheets-viewport" id="sheets-viewport">
        <div class="print-area" id="print-area"></div>
      </div>
    </main>
  </div>

  <!-- ── Print dialog: pick the cartels to print ── -->
  <dialog class="panel print-dialog" id="print-dialog" aria-labelledby="print-dialog-title">
    <h1 id="print-dialog-title">Imprimer</h1>
    <ul class="print-list" id="print-list"></ul>
    <button class="btn" id="btn-print-toggle-all" onclick="togglePrintAll()">Tout décocher</button>
    <p class="print-info" id="print-dialog-info"></p>
    <div class="print-dialog-actions">
      <button class="btn" onclick="closePrintDialog()">Annuler</button>
      <button class="btn btn-print" id="btn-print-confirm" onclick="confirmPrint()">Imprimer</button>
    </div>
  </dialog>

  <script>
    const LEGACY_STORAGE_KEY = 'cartels.v1';  // pre-URL autosave, migrated once
    const LONG_LINK   = 2000;  // characters; some chat and mail apps truncate longer URLs
    const PER_SHEET   = 6;
    const MIN_K       = 0.6;   // smallest font scale auto-shrink may use
    const WARN_K      = 0.8;   // below this, flag the cartel as shrunk
    // Stored positionally in links: only ever append new fields.
    const FIELDS      = ['firstname', 'lastname', 'birth', 'death', 'title', 'medium', 'year', 'description', 'nationality'];
    const narrow      = matchMedia('(max-width: 760px)');  // stacked layout, see CSS

    function scrollToForm() {
      document.querySelector('.form-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function esc(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function blankCartel() {
      const c = { id: newId() };
      FIELDS.forEach(f => c[f] = '');
      return c;
    }

    function sampleCartel() {
      return {
        id: newId(),
        firstname: 'Jean-Baptiste',
        lastname: 'Pigalle',
        nationality: 'Française',
        birth: 'Paris, 1714',
        death: 'Paris, 1785',
        title: 'Voltaire nu',
        medium: 'Marbre',
        year: '1776',
        description: 'La statue fut commandée par un groupe de gens de lettres souhaitant honorer le philosophe de son vivant. Pigalle représenta Voltaire nu à la manière antique, ce qui suscita la polémique.',
      };
    }

    /* ── State & persistence ──
       The URL fragment holds the whole state: #<base64url(deflate-raw(JSON))>,
       with cartel fields stored positionally in FIELDS order. */

    async function pipeBytes(bytes, transform) {
      const stream = new Blob([bytes]).stream().pipeThrough(transform);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    function toBase64Url(bytes) {
      let bin = '';
      bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function fromBase64Url(str) {
      const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
      return Uint8Array.from(bin, ch => ch.charCodeAt(0));
    }

    async function encodeState(s) {
      const payload = {
        v: 1,
        s: s.style,
        i: Math.max(0, s.cartels.findIndex(c => c.id === s.selected)),
        c: s.cartels.map(c => FIELDS.map(f => c[f])),
      };
      const json = new TextEncoder().encode(JSON.stringify(payload));
      return toBase64Url(await pipeBytes(json, new CompressionStream('deflate-raw')));
    }

    // Returns null for anything that isn't a valid v1 state (corrupt or truncated link).
    async function decodeState(encoded) {
      try {
        const json = await pipeBytes(fromBase64Url(encoded), new DecompressionStream('deflate-raw'));
        const p = JSON.parse(new TextDecoder().decode(json));
        if (p.v !== 1 || !Array.isArray(p.c) || !p.c.length || !p.c.every(Array.isArray)) return null;
        const cartels = p.c.map(values => {
          const c = { id: newId() };
          FIELDS.forEach((f, j) => c[f] = typeof values[j] === 'string' ? values[j] : '');
          return c;
        });
        const i = Math.min(Math.max(0, p.i | 0), cartels.length - 1);
        return { style: styles[p.s] ? p.s : 'louvre', cartels, selected: cartels[i].id };
      } catch (e) {
        return null;
      }
    }

    let migratedLegacy = false;

    async function load() {
      const fromUrl = location.hash.length > 1 && await decodeState(location.hash.slice(1));
      if (fromUrl) return fromUrl;
      try {
        const legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY));
        if (legacy && Array.isArray(legacy.cartels) && legacy.cartels.length) {
          migratedLegacy = true;
          return legacy;
        }
      } catch (e) { /* storage unavailable or corrupt */ }
      const c = sampleCartel();
      return { style: 'louvre', cartels: [c], selected: c.id };
    }

    // Debounced: typing updates the URL once it pauses.
    let saveTimer = null;
    let saveSeq   = 0;

    function save() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(writeUrl, 300);
    }

    async function writeUrl() {
      clearTimeout(saveTimer);
      const seq = ++saveSeq;
      const encoded = await encodeState(state);
      if (seq !== saveSeq) return;  // a newer write (or a loaded link) superseded this one
      history.replaceState(null, '', '#' + encoded);
      renderLinkInfo();
    }

    const state = {};

    function selectedIndex() {
      const i = state.cartels.findIndex(c => c.id === state.selected);
      return i === -1 ? 0 : i;
    }

    function current() {
      return state.cartels[selectedIndex()];
    }

    /* ── Label rendering ── */

    function descriptionHTML(c) {
      return `<p class="description">${esc(c.description).replace(/\n/g, '<br>')}</p>`;
    }

    // Each style renders its own label content; the wrapper is shared.
    const styles = {
      louvre: {
        name: 'Louvre',
        body: c => {
          const lifespan = [c.birth, c.death].filter(Boolean).join(' – ');
          const dates    = [c.nationality, lifespan].filter(Boolean).join(', ');
          const med      = [c.medium, c.year].filter(Boolean).join('. ') + (c.medium || c.year ? '.' : '');
          return `
            <p class="artist">
              <span class="firstname">${esc(c.firstname) + (c.firstname && c.lastname ? ' ' : '')}</span>
              <span class="lastname">${esc(c.lastname)}</span>
            </p>
            <p class="dates">${esc(dates)}</p>
            <p class="artwork-title">${esc(c.title)}</p>
            <p class="medium">${esc(med)}</p>
            ${descriptionHTML(c)}`;
        },
      },
      moma: {
        name: 'MoMA',
        body: c => {
          const artist   = [c.firstname, c.lastname].filter(Boolean).join(' ');
          const lifespan = [c.birth, c.death].filter(Boolean).join('–');
          const dates    = [c.nationality, lifespan].filter(Boolean).join(', ');
          return `
            <p class="artist">${esc(artist)}</p>
            <p class="dates">${esc(dates)}</p>
            <p class="artwork-title"><strong>${esc(c.title)}</strong>${c.year ? `<span class="year">${esc(c.year)}</span>` : ''}</p>
            <p class="medium">${esc(c.medium)}</p>
            ${descriptionHTML(c)}`;
        },
      },
      orsay: {
        name: 'Orsay',
        body: c => {
          const artist = [c.firstname, c.lastname].filter(Boolean).join(' ');
          const dates  = [c.birth, c.death].filter(Boolean).join(' – ');
          return `
            <p class="artist">${esc(artist)}</p>
            <p class="dates">${esc(dates)}</p>
            <div class="work">
              <p class="artwork-title">${esc(c.title)}</p>
              <p class="year">${esc(c.year)}</p>
              <p class="medium">${esc(c.medium)}</p>
              ${descriptionHTML(c)}
            </div>`;
        },
      },
    };

    function labelHTML(c) {
      return `
        <div class="label style-${state.style}${c.id === state.selected ? ' selected' : ''}" data-id="${c.id}">
          <div class="label-content">${styles[state.style].body(c)}
          </div>
        </div>`;
    }

    // Shrink the font scale until the content fits the fixed label size.
    function fit(label) {
      const content = label.querySelector('.label-content');
      const overflows = () => content.scrollHeight > content.clientHeight + 1;
      let k = 1;
      label.style.setProperty('--k', k);
      while (overflows() && k > MIN_K) {
        k = Math.max(MIN_K, k - 0.025);
        label.style.setProperty('--k', k);
      }
      if (overflows())   label.dataset.fit = 'overflow';
      else if (k < WARN_K) label.dataset.fit = 'shrunk';
    }

    // Ids picked in the print dialog; while set, the sheets hold only those
    // cartels, packed together. Null prints everything (e.g. Ctrl+P).
    let printSelection = null;

    function renderPrintArea() {
      const area = document.getElementById('print-area');
      const cartels = printSelection ? state.cartels.filter(c => printSelection.has(c.id)) : state.cartels;
      let html = '';
      for (let i = 0; i < cartels.length; i += PER_SHEET) {
        html += '<div class="sheet">' + cartels.slice(i, i + PER_SHEET).map(labelHTML).join('') + '</div>';
      }
      area.innerHTML = html;
      area.querySelectorAll('.label').forEach(fit);
      scalePreview();
    }

    function renderOneInPrintArea(c) {
      const old = document.querySelector(`#print-area .label[data-id="${c.id}"]`);
      old.outerHTML = labelHTML(c);
      fit(document.querySelector(`#print-area .label[data-id="${c.id}"]`));
    }

    // Scale the sheets down to the preview panel width (never up).
    function scalePreview() {
      const area     = document.getElementById('print-area');
      const viewport = document.getElementById('sheets-viewport');
      const panel    = viewport.parentElement;
      const room     = parseFloat(getComputedStyle(viewport).paddingLeft);
      const scale    = Math.min(1, panel.clientWidth / area.offsetWidth);
      area.style.transform    = `scale(${scale})`;
      viewport.style.width    = area.offsetWidth * scale + 2 * room + 'px';
      viewport.style.height   = area.offsetHeight * scale + 2 * room + 'px';
    }

    function markSelected() {
      document.querySelectorAll('#print-area .label').forEach(el =>
        el.classList.toggle('selected', el.dataset.id === state.selected));
    }

    function sheetsText(n) {
      const sheets = Math.ceil(n / PER_SHEET);
      return `${sheets} page${sheets > 1 ? 's' : ''} A4 (${PER_SHEET} par page, 10 × 7 cm)`;
    }

    function renderControls() {
      document.getElementById('btn-delete').disabled = state.cartels.length === 1;

      const n = state.cartels.length;
      const sheets = Math.ceil(n / PER_SHEET);
      document.getElementById('print-info').textContent =
        `${n} cartel${n > 1 ? 's' : ''} · ${sheetsText(n)}. Découper le long des pointillés.`;      document.getElementById('preview-title').textContent = `Aperçu · ${sheets} page${sheets > 1 ? 's' : ''} A4`;
    }

    function renderLinkInfo() {
      const n = location.href.length;
      document.getElementById('link-info').textContent = n > LONG_LINK
        ? `Lien long (${(n / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} Ko) : certaines messageries peuvent le tronquer.`
        : '';
    }

    function fillForm() {
      const c = current();
      FIELDS.forEach(f => document.getElementById('inp-' + f).value = c[f]);
    }

    function renderAll() {
      renderPrintArea();
      renderControls();
    }

    /* ── Actions ── */

    function selectCartel(id) {
      state.selected = id;
      save();
      fillForm();
      markSelected();
      renderControls();
    }

    function insertAfterSelected(c) {
      state.cartels.splice(selectedIndex() + 1, 0, c);
      state.selected = c.id;
      save();
      fillForm();
      renderAll();
      if (narrow.matches) scrollToForm();
      else document.querySelector('#print-area .label.selected').scrollIntoView({ block: 'nearest' });
      document.getElementById('inp-firstname').focus({ preventScroll: true });
    }

    function addCartel() {
      insertAfterSelected(blankCartel());
    }

    function duplicateCartel() {
      insertAfterSelected({ ...current(), id: newId() });
    }

    // Two-step delete: first click arms the button, second confirms.
    let deleteTimer = null;
    function deleteCartel() {
      const btn = document.getElementById('btn-delete');
      if (!btn.classList.contains('confirming')) {
        btn.classList.add('confirming');
        btn.textContent = 'Confirmer ?';
        deleteTimer = setTimeout(resetDeleteButton, 3000);
        return;
      }
      resetDeleteButton();
      const i = selectedIndex();
      state.cartels.splice(i, 1);
      state.selected = state.cartels[Math.min(i, state.cartels.length - 1)].id;
      save();
      fillForm();
      renderAll();
    }

    function resetDeleteButton() {
      clearTimeout(deleteTimer);
      const btn = document.getElementById('btn-delete');
      btn.classList.remove('confirming');
      btn.textContent = 'Supprimer';
    }

    /* ── Print dialog ── */

    function printBoxes() {
      return [...document.querySelectorAll('#print-list input')];
    }

    function openPrintDialog() {
      document.getElementById('print-list').innerHTML = state.cartels.map((c, i) => {
        const artist = [c.firstname, c.lastname].filter(Boolean).join(' ');
        const name = [artist, c.title].filter(Boolean).join(' — ') || `Cartel ${i + 1}`;
        return `<li><label><input type="checkbox" data-index="${i}" checked> ${esc(name)}</label></li>`;
      }).join('');
      renderPrintDialog();
      document.getElementById('print-dialog').showModal();
    }

    function renderPrintDialog() {
      const boxes = printBoxes();
      const p = boxes.filter(b => b.checked).length;
      const confirmBtn = document.getElementById('btn-print-confirm');
      confirmBtn.disabled = p === 0;
      confirmBtn.textContent = p ? `Imprimer ${p} cartel${p > 1 ? 's' : ''}` : 'Aucun cartel coché';
      document.getElementById('print-dialog-info').textContent = p ? sheetsText(p) + '.' : '';
      const toggle = document.getElementById('btn-print-toggle-all');
      toggle.textContent = p === boxes.length ? 'Tout décocher' : 'Tout cocher';
      toggle.hidden = boxes.length === 1;
    }

    function togglePrintAll() {
      const boxes = printBoxes();
      const on = !boxes.every(b => b.checked);
      boxes.forEach(b => b.checked = on);
      renderPrintDialog();
    }

    function confirmPrint() {
      printSelection = new Set(printBoxes().filter(b => b.checked).map(b => state.cartels[b.dataset.index].id));
      closePrintDialog();
      window.print();
    }

    function closePrintDialog() {
      document.getElementById('print-dialog').close();
    }

    function switchStyle() {
      state.style = document.getElementById('inp-style').value;
      syncStyle();
      save();
      renderAll();
    }

    function syncStyle() {
      document.getElementById('inp-style').value = state.style;
    }

    let copyTimer = null;
    async function copyLink() {
      await writeUrl();  // flush a pending debounced save first
      const btn = document.getElementById('btn-copy');
      try {
        await navigator.clipboard.writeText(location.href);
        btn.textContent = 'Lien copié ✓';
      } catch (e) {
        btn.textContent = "Copiez l'adresse de la page";
      }
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => btn.textContent = 'Copier le lien', 2000);
    }

    function onFieldInput(e) {
      const c = current();
      c[e.target.dataset.field] = e.target.value;
      save();
      renderOneInPrintArea(c);
    }

    /* ── Init ── */

    document.querySelectorAll('[data-field]').forEach(el => el.addEventListener('input', onFieldInput));
    document.getElementById('print-area').addEventListener('click', e => {
      const label = e.target.closest('.label');
      if (!label) return;
      selectCartel(label.dataset.id);
      if (narrow.matches) scrollToForm();
    });
    document.getElementById('print-list').addEventListener('change', renderPrintDialog);
    window.addEventListener('resize', scalePreview);

    // Ctrl+P skips the dialog: printSelection is null then, so all cartels print.
    window.addEventListener('beforeprint', renderPrintArea);
    window.addEventListener('afterprint', () => { printSelection = null; renderPrintArea(); });

    // A different link pasted into this tab: load it.
    window.addEventListener('hashchange', async () => {
      const loaded = await decodeState(location.hash.slice(1));
      if (!loaded) return;
      clearTimeout(saveTimer);
      saveSeq++;  // drop any in-flight write of the previous state
      Object.assign(state, loaded);
      syncStyle();
      fillForm();
      renderAll();
      renderLinkInfo();
    });

    async function init() {
      Object.assign(state, await load());
      syncStyle();
      fillForm();
      renderAll();
      await writeUrl();
      if (migratedLegacy) {
        try { localStorage.removeItem(LEGACY_STORAGE_KEY); } catch (e) { /* storage unavailable */ }
      }
    }

    init();
  </script>
</body>
</html>
